# Web app and database. Run on your computer with: docker compose up -d --build
name: 23l-0881_a2_ops

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # "expose" is reachable only on the Compose network. There is deliberately no "ports".
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  web:
    build: .
    image: 23l-0881_a2_ops-web:latest
    restart: on-failure:3
    depends_on:
      db:
        condition: service_healthy
    environment:
      INFERENCE_MODE: ${INFERENCE_MODE:-local}
      MODEL_PATH: /models/model.keras
      MODEL_VERSION: ${MODEL_VERSION:-VisionGuard:unversioned}
      MODEL_THRESHOLD: ${MODEL_THRESHOLD:-0.5}
      MODEL_API_URL: ${MODEL_API_URL:-}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-8}
      # "db" is resolved by Compose's internal DNS.
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    volumes:
      - ./models/champion:/models:ro
    ports:
      - "5000:5000"

volumes:
  pgdata:
