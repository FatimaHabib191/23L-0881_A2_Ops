{% extends "base.html" %}
{% block title %}{{ title }} | VisionGuard{% endblock %}
{% block content %}
<section class="panel error">
  <p class="eyebrow">Error {{ status }}</p>
  <h1>{{ title }}</h1>
  <p>{{ message }}</p>
  <a class="button" href="{{ url_for('upload') }}">Try another image</a>
</section>
{% endblock %}
