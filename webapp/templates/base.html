<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}VisionGuard{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('upload') }}">VisionGuard</a>
    <nav>
      <a href="{{ url_for('upload') }}" {% if active == 'upload' %}aria-current="page"{% endif %}>Check an image</a>
      <a href="{{ url_for('history') }}" {% if active == 'history' %}aria-current="page"{% endif %}>History</a>
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer>Roll number 23L-0881 &middot; 23L-0881_A2_Ops</footer>
  {% block scripts %}{% endblock %}
</body>
</html>
